services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: visitcard
      POSTGRES_PASSWORD: visitcard
      POSTGRES_DB: visitcard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitcard -d visitcard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://visitcard:visitcard@db:5432/visitcard?schema=public
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  # Optional: frontend from sibling repo (build context ../web)
  # web:
  #   build:
  #     context: ../web
  #     args:
  #       VITE_GRAPHQL_URL: http://localhost:3000/graphql
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - api

volumes:
  pgdata:
